modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

logoFile="assets/apoli/icon.png"
catalogueImageIcon="assets/apoli/icon.png"

authors="Overgrown"

description='''
Data-pack-driven Powers library for NeoForge 1.21.1.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}-icarus.mixins.json"

[[mixins]]
config="${mod_id}-figura.mixins.json"

[[mixins]]
config="${mod_id}-skinlayers.mixins.json"

[[mixins]]
config="${mod_id}-ears.mixins.json"

[[mixins]]
config="${mod_id}-sable.mixins.json"

[[mixins]]
config="${mod_id}-bettercombat.mixins.json"

[[mixins]]
config="${mod_id}-walkers.mixins.json"

[[mixins]]
config="${mod_id}-sodium.mixins.json"

[[mixins]]
config="${mod_id}-flywheel.mixins.json"

[[mixins]]
config="${mod_id}-ledger.mixins.json"

[[mixins]]
config="${mod_id}-yigd.mixins.json"

[[mixins]]
config="${mod_id}-gravestone.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="origins"
    type="incompatible"
    reason="Origins older than 1.49.0 was built against an older Apoli API. Update Origins."
    versionRange="[0,1.49.0)"
    ordering="NONE"
    side="BOTH"

["badoptimizations:cache_hooks"]
    lightmap="dev.overgrown.apoli.compat.badoptimizations.BadOptimizationsLightmapHook"

["badoptimizations:incompatibilities"]
    options=["enable_remove_redundant_fov_calculations"]
