<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apoli Speech-to-Action</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #17181c; color: #e8eaed; text-align: center; padding: 2.5em 1em; }
        h1 { color: #8ab4f8; margin-bottom: 0.2em; }
        p.info { color: #9aa0a6; max-width: 34em; margin: 0.4em auto 1.6em; line-height: 1.5; }
        #status { font-weight: 600; }
        #transcript { font-size: 1.5em; min-height: 1.6em; margin-top: 1em; color: #fff; }
        .lang { color: #9aa0a6; font-size: 0.95em; }
        select { background: #2a2c33; color: #e8eaed; border: 1px solid #444; border-radius: 4px; padding: 0.3em 0.5em; font-size: 1em; }
    </style>
</head>
<body>
    <h1>Apoli Speech-to-Action</h1>
    <p class="info">Keep this tab open in the background while you play. Your microphone is transcribed here in your browser and only the recognised text is sent to the game — no audio leaves this page, and nothing is stored.</p>
    <p id="status">Starting…</p>
    <p class="lang">Speak in: <select id="langSelect"></select></p>
    <div id="transcript"></div>
    <script src="/speech.js"></script>
</body>
</html>
