plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Wispforest"
        url = "https://maven.wispforest.io/releases"
    }
    maven {
        name = "TheIllusiveC4"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Sinytra"
        url = "https://maven.su5ed.dev/releases"
    }
    maven {
        name = "TwelveIterations"
        url = "https://maven.twelveiterations.com/repository/maven-public/"
    }
    maven {
        name = "CreateMod"
        url = "https://maven.createmod.net"
        content {
            includeGroup "dev.engine-room.flywheel"
            includeGroup "dev.engine-room.vanillin"
        }
    }
    maven {
        name = "Saps"
        url = "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "maven.modrinth:icarus:${project.icarus_version}"
    compileOnly "maven.modrinth:icarus-rewinged:${project.icarus_rewinged_version}"

    compileOnly "maven.modrinth:figura:${project.figura_version}"

    compileOnly "io.wispforest:accessories-neoforge:${project.accessories_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"

    compileOnly "net.blay09.mods:balm-neoforge:${project.balm_version}"
    compileOnly "net.blay09.mods:hardcorerevival-neoforge:${project.hardcore_revival_version}"

    compileOnly "maven.modrinth:3dskinlayers:${project.skinlayers_version}"
    compileOnly "maven.modrinth:ears:${project.ears_version}"

    compileOnly "maven.modrinth:sodium:${project.sodium_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${project.flywheel_version}"
    compileOnly "dev.engine-room.vanillin:vanillin-neoforge-1.21.1:${project.vanillin_version}"

    compileOnly "maven.modrinth:yigd:${project.yigd_version}"
    compileOnly "maven.modrinth:gravestone-mod:${project.gravestone_version}"

    compileOnly "maven.modrinth:skills:${project.puffish_skills_version}"

    compileOnly "dev.latvian.mods:kubejs-neoforge:${project.kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${project.rhino_version}"

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            version = project.maven_version
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }

}
