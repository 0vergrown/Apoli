# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=1.3.0
maven_group=dev.overgrown.apoli
# Maven coordinate version — loader+MC-qualified so all Apoli variants coexist in mavenLocal.
# The in-game mod version (fabric.mod.json) stays mod_version; this only affects the published GAV.
maven_version=1.0.0+1.20.1-fabric

# Dependencies
fabric_api_version=0.92.9+1.20.1
# Icarus (compile-only, optional at runtime) — the Modrinth version_number for Fabric 1.20.1.
# Bump per https://modrinth.com/mod/icarus/versions.
icarus_version=2.14.0+Fabric
# Figura (compile-only, optional at runtime). Figura reuses the same version_number across
# loaders, so the Modrinth maven needs the VERSION ID, not the number.
# 7WXBplQj = Figura 0.1.6+1.20.1 (Fabric). Bump per https://modrinth.com/mod/figura/versions.
figura_version=7WXBplQj
# Accessory-slot mods (compile-only, optional at runtime; gated by ModCompat / Accessories facade).
trinkets_version=3.7.2
accessories_version=1.0.0-beta.47+1.20.1
# Hardcore Revival + Balm (compile-only, optional at runtime; gated by ModCompat.HARDCORE_REVIVAL).
# HR 12.x wants balm 7.4.0-SNAPSHOT (unreleased) → we pin the highest released Balm 7.x instead.
balm_version=7.3.39+1.20.1
# Hardcore Revival: the API-bearing 12.0.14-SNAPSHOT is only on the Blay09 maven-snapshots repo behind
# auth (401), so it can't be resolved here. We use the newest PUBLIC jar (Modrinth 12.0.13) — which has
# the manager but NOT the public API — and keep the manager-based 1.20.1 code. Modrinth needs the VERSION
# ID: cX6AVRi8 = 12.0.13+fabric-1.20.1. Swap to hardcorerevival-fabric:12.0.14+ once it's public.
hardcore_revival_version=cX6AVRi8