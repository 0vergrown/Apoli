# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=dev.overgrown.apoli
# Maven coordinate version — loader+MC-qualified so all Apoli variants coexist in mavenLocal.
# The in-game mod version (fabric.mod.json) stays mod_version; this only affects the published GAV.
maven_version=1.0.0+1.21.1-fabric

# Dependencies
fabric_api_version=0.116.12+1.21.1