# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=1.3.0
maven_group=dev.overgrown.apoli
# Maven coordinate version — loader+MC-qualified so all Apoli variants coexist in mavenLocal.
# The in-game mod version (fabric.mod.json) stays mod_version; this only affects the published GAV.
maven_version=1.0.0+1.21.1-fabric

# Dependencies
fabric_api_version=0.116.12+1.21.1
# Icarus (compile-only, optional at runtime) — the Modrinth version_number for Fabric 1.21.1.
# WingsValues is a runtime proxy, so it tolerates any Icarus version regardless; this just keeps
# the compile API matched to the runtime. Bump per https://modrinth.com/mod/icarus/versions.
icarus_version=4.7.6+Fabric
# Figura (compile-only, optional at runtime). Figura reuses the same version_number across
# loaders, so the Modrinth maven needs the VERSION ID, not the number.
# ugF3NunW = Figura 0.1.6+1.21.1 (Fabric). Bump per https://modrinth.com/mod/figura/versions.
figura_version=ugF3NunW
# Accessory-slot mods (compile-only, optional at runtime; gated by ModCompat / Accessories facade).
# Trinkets via TerraformersMC maven; Accessories via wispforest maven (loader-qualified artifact).
trinkets_version=3.8.1
accessories_version=1.1.0-beta.53+1.21.1
# Hardcore Revival + Balm (compile-only, optional at runtime; gated by ModCompat.HARDCORE_REVIVAL).
balm_version=21.0.55+1.21.1
hardcore_revival_version=21.1.9+1.21.1